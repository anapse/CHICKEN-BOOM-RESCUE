name: Validate Chicken Boom Rescue

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [fix/character-selection-flow]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps
      - name: TypeScript validation
        run: npm run lint
      - name: Map generation regression check
        run: npm run check:map
      - name: Production build
        run: npm run build
      - name: PNG sprite inventory summary
        run: node scripts/inventory-sprites.mjs --markdown | tee sprite-inventory.md >> "$GITHUB_STEP_SUMMARY"
